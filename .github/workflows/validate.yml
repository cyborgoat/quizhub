name: Validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
        env:
          # Production URL from repo variable when set; placeholder is enough to exercise the build.
          QUIZHUB_BASE_URL: ${{ vars.QUIZHUB_BASE_URL || 'https://example.test/quizhub/' }}
